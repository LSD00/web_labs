<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход — ЛанчБокс</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="auth-page">
    <div class="auth-box">
      <h2>Вход в аккаунт</h2>

      <form class="auth-form" method="POST" action="https://httpbin.org/post">

        <label>
          Логин
          <input type="text" name="login" placeholder="Ваш логин" required />
        </label>

        <label>
          Пароль
          <input type="password" name="password" placeholder="Ваш пароль" required />
        </label>

        <label class="auth-checkbox">
          <input type="checkbox" name="remember" />
          Запомнить меня
        </label>

        <button type="submit">Войти</button>

      </form>

      <p style="margin-top: 20px; text-align: center; font-size: 14px; color: #666;">
        <a href="index.html" style="color: #ff6b35; text-decoration: none;">← Вернуться на главную</a>
      </p>
    </div>
  </div>

</body>
</html>
